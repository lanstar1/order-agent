<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>랜스타 상담 챗봇 (사내 전용)</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafbfc; --ink:#15181d; --ink-2:#5b6472;
  --line:#dfe3e8; --line-2:#eceff3; --accent:#1b56c4; --accent-ink:#ffffff;
  --user-bg:#1b56c4; --user-ink:#ffffff;
  --warn-bg:#fff5e6; --warn-line:#e8a33d; --warn-ink:#7a4a05;
  --danger:#b3261e; --ok:#15803d;
  --b-cert-bg:#e3f0ff; --b-cert-ink:#0f3f8f; --b-cert-line:#a9ccfb;
  --b-hist-bg:#e9f6ec; --b-hist-ink:#1c6b34; --b-hist-line:#a9dcb8;
  --b-ai-bg:#fdf0e3; --b-ai-ink:#8a4b06; --b-ai-line:#f0c391;
  --b-llm-bg:#f1eaff; --b-llm-ink:#4c2b93; --b-llm-line:#cbb6f5;
  --b-rule-bg:#eef0f3; --b-rule-ink:#4a5361; --b-rule-line:#d3d8df;
  --code:#f2f4f7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116; --panel:#161a21; --panel-2:#1b2029; --ink:#e6e9ee; --ink-2:#9aa4b2;
    --line:#2a313c; --line-2:#232932; --accent:#5c9dff; --accent-ink:#0b1220;
    --user-bg:#2b5fd0; --user-ink:#ffffff;
    --warn-bg:#3a2a10; --warn-line:#c08b34; --warn-ink:#f5d9a8;
    --danger:#ff8a80; --ok:#6ee7a2;
    --b-cert-bg:#12283f; --b-cert-ink:#a8cdff; --b-cert-line:#2b4d78;
    --b-hist-bg:#12301d; --b-hist-ink:#a4e3ba; --b-hist-line:#2c5b3b;
    --b-ai-bg:#3a2810; --b-ai-ink:#f3c98f; --b-ai-line:#6d4c1c;
    --b-llm-bg:#241a3d; --b-llm-ink:#cfb9ff; --b-llm-line:#443272;
    --b-rule-bg:#212730; --b-rule-ink:#aeb7c3; --b-rule-line:#39414d;
    --code:#11151b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
       "Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{display:flex; flex-direction:column; height:100dvh; max-width:1000px; margin:0 auto;}

/* ---------------- header ---------------- */
header{
  flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:8px; margin-right:auto; min-width:0}
.brand h1{font-size:16px; margin:0; font-weight:700; letter-spacing:-.2px; white-space:nowrap}
.brand .sub{font-size:12px; color:var(--ink-2); white-space:nowrap}
.hdr-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel-2)}
.seg button{
  appearance:none; border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  font:600 12px/1 inherit; padding:8px 11px; font-family:inherit;
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.ghost{
  appearance:none; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2);
  border-radius:8px; padding:8px 11px; font:600 12px/1 inherit; cursor:pointer; font-family:inherit;
}
.ghost:hover{border-color:var(--accent); color:var(--accent)}
.status{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--ink-2)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ink-2); flex:0 0 auto}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)}
.mode-warn{
  width:100%; margin-top:2px; font-size:12px; color:var(--warn-ink); background:var(--warn-bg);
  border:1px solid var(--warn-line); border-radius:8px; padding:6px 10px;
}

/* ---------------- log ---------------- */
main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:16px 14px 8px; -webkit-overflow-scrolling:touch}
.msg{margin:0 0 16px; max-width:100%}
.msg.user{display:flex; justify-content:flex-end}
.bubble{
  background:var(--user-bg); color:var(--user-ink); padding:9px 13px; border-radius:14px 14px 3px 14px;
  max-width:min(82%,640px); white-space:pre-wrap; word-break:break-word; box-shadow:var(--shadow);
}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden;
}
.card-head{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  padding:9px 12px; border-bottom:1px solid var(--line-2); background:var(--panel-2);
}
.route-tag{
  font:700 11px/1 inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line);
  color:var(--ink-2); background:var(--panel); white-space:nowrap;
}
.route-tag[data-route="cert"]{background:var(--b-cert-bg); color:var(--b-cert-ink); border-color:var(--b-cert-line)}
.route-tag[data-route="mixed"]{background:var(--b-ai-bg); color:var(--b-ai-ink); border-color:var(--b-ai-line)}
.badges{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.badge{
  font:700 11px/1 inherit; padding:5px 8px; border-radius:999px; border:1px solid transparent;
  white-space:nowrap; cursor:help;
}
.badge .n{font-weight:600; opacity:.75; margin-left:3px}
.badge[data-k="cert"]{background:var(--b-cert-bg); color:var(--b-cert-ink); border-color:var(--b-cert-line)}
.badge[data-k="history"]{background:var(--b-hist-bg); color:var(--b-hist-ink); border-color:var(--b-hist-line)}
.badge[data-k="spec"]{background:var(--b-ai-bg); color:var(--b-ai-ink); border-color:var(--b-ai-line)}
.badge[data-k="llm"]{background:var(--b-llm-bg); color:var(--b-llm-ink); border-color:var(--b-llm-line)}
.badge[data-k="rule"],.badge[data-k="other"]{background:var(--b-rule-bg); color:var(--b-rule-ink); border-color:var(--b-rule-line)}
.ms{margin-left:auto; font-size:11px; color:var(--ink-2); white-space:nowrap}

.notices{
  margin:12px 12px 0; border:1px solid var(--warn-line); background:var(--warn-bg);
  color:var(--warn-ink); border-radius:10px; padding:10px 12px;
}
.notices h3{margin:0 0 6px; font-size:12px; font-weight:800; letter-spacing:.2px; display:flex; gap:6px; align-items:center}
.notices ul{margin:0; padding-left:18px}
.notices li{margin:3px 0; font-size:13.5px; word-break:break-word}
.notices .re{margin:7px 0 0; font-size:11.5px; opacity:.85}

.body{padding:12px; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere}
.body.ai-caution{border-left:3px solid var(--b-ai-line); margin:12px; padding:10px 12px;
  border-radius:0 8px 8px 0; background:var(--panel-2)}

.sect{margin:0 12px 12px; border-top:1px dashed var(--line); padding-top:10px}
.sect h3{margin:0 0 8px; font-size:12px; font-weight:800; color:var(--ink-2); letter-spacing:.2px}
.cands{display:flex; gap:8px; flex-wrap:wrap}
.cand{
  appearance:none; border:1px solid var(--accent); background:transparent; color:var(--accent);
  border-radius:8px; padding:8px 12px; font:700 13px/1 inherit; cursor:pointer; font-family:inherit;
}
.cand:hover{background:var(--accent); color:var(--accent-ink)}
.cand[disabled]{opacity:.45; cursor:default; background:transparent; color:var(--accent)}

.file{
  display:flex; gap:8px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--panel-2); margin-bottom:8px; flex-wrap:wrap;
}
.file .fmeta{flex:1 1 260px; min-width:0}
.file .fname{font-size:13px; font-weight:700; word-break:break-all}
.file .fpath{font-size:11.5px; color:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  word-break:break-all; margin-top:3px}
.file .ftag{font-size:11px; color:var(--ink-2); margin-top:3px}
.file .facts{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.copy{
  appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
  border-radius:7px; padding:6px 9px; font:600 11.5px/1 inherit; cursor:pointer; white-space:nowrap;
  font-family:inherit;
}
.copy:hover{border-color:var(--accent); color:var(--accent)}
.copy.done{border-color:var(--ok); color:var(--ok)}
.linkbtn{text-decoration:none; display:inline-block}
/* 클립보드 API 가 막혔을 때만 나타나는 수동 복사 상자 */
.manualcopy{
  display:none; width:100%; margin-top:6px; min-height:52px; resize:vertical;
  border:1px solid var(--accent); border-radius:7px; padding:6px 8px; background:var(--panel);
  color:var(--ink); font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.warnflag{color:var(--warn-ink); background:var(--warn-bg); border:1px solid var(--warn-line);
  border-radius:5px; padding:2px 6px; font-size:11px; font-weight:700}

details.raw{margin:0 12px 12px}
details.raw summary{cursor:pointer; font-size:12px; color:var(--ink-2); user-select:none}
details.raw pre{
  margin:8px 0 0; background:var(--code); border:1px solid var(--line); border-radius:8px;
  padding:10px; font-size:11.5px; max-height:340px; overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.sysline{
  text-align:center; color:var(--ink-2); font-size:12px; margin:0 0 14px;
  border:1px dashed var(--line); border-radius:8px; padding:8px 10px; background:var(--panel-2);
}
.sysline.err{color:var(--danger); border-color:var(--danger)}

/* ---------------- composer ---------------- */
footer{
  flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.chip{
  appearance:none; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2);
  border-radius:999px; padding:6px 10px; font:600 12px/1 inherit; cursor:pointer; font-family:inherit;
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.composer{display:flex; gap:8px; align-items:flex-end}
textarea{
  flex:1 1 auto; resize:none; min-height:44px; max-height:160px; padding:11px 12px;
  border:1px solid var(--line); border-radius:10px; background:var(--panel-2); color:var(--ink);
  font:15px/1.5 inherit; font-family:inherit;
}
textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.send{
  appearance:none; border:0; background:var(--accent); color:var(--accent-ink); border-radius:10px;
  padding:0 18px; height:44px; font:700 14px/1 inherit; cursor:pointer; white-space:nowrap; font-family:inherit;
}
.send[disabled]{opacity:.5; cursor:default}
.hintline{margin:7px 2px 0; font-size:11.5px; color:var(--ink-2)}

.legend{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.legend .badge{cursor:default}

@media (max-width:640px){
  .brand .sub{display:none}
  .ms{display:none}
  main{padding:12px 10px 6px}
  header{padding:9px 10px}
  footer{padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
  /* 범례·예시는 줄바꿈 대신 가로 스크롤 — 세로로 쌓이면 대화 로그가 통째로 밀린다 */
  .legend,.chips{flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
                 scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:2px}
  .legend::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
  .legend .badge,.chips .chip{flex:0 0 auto}
  .mode-warn{font-size:11.5px; padding:5px 8px}
  .hintline{font-size:11px}
  .copy{padding:5px 8px}
  .bubble{max-width:92%}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>랜스타 상담 챗봇</h1>
      <span class="sub">사내 영업·CS 전용</span>
    </div>
    <div class="hdr-tools">
      <div class="status" id="health" title="서버 상태">
        <span class="dot" id="hdot"></span><span id="htext">상태 확인 중…</span>
      </div>
      <div class="seg" role="group" aria-label="응답 모드">
        <button type="button" id="m-internal" aria-pressed="true"
                title="사내 전용. 파일 경로와 O* 추론매핑까지 표시합니다.">사내(internal)</button>
        <button type="button" id="m-customer" aria-pressed="false"
                title="고객 직접 노출용. 파일 경로와 추론매핑을 숨깁니다.">고객(customer)</button>
      </div>
      <button type="button" class="ghost" id="btn-reset" title="대화 맥락(직전 모델·되묻기)을 비웁니다">새 대화</button>
    </div>
    <div class="mode-warn" id="modewarn" hidden></div>
  </header>

  <main id="log" aria-live="polite"></main>

  <footer>
    <div class="legend" aria-label="근거 배지 범례">
      <span class="badge" data-k="cert" title="cert_lookup 인증·기술자료 KB. 인증 문의의 유일한 근거입니다.">인증KB</span>
      <span class="badge" data-k="history" title="2023~2025년 과거 상담 기록. 현재 사양·정책과 다를 수 있습니다.">상담이력</span>
      <span class="badge" data-k="spec" title="제품 이미지 한 장을 보고 만든 AI 추론. 확정 사양이 아닙니다.">제품분석(AI추정)</span>
      <span class="badge" data-k="llm" title="문장 다듬기에만 LLM 사용. 근거 원문이 함께 표시됩니다.">LLM생성</span>
      <span class="badge" data-k="rule" title="LLM 없이 규칙으로 조립한 응답입니다.">규칙기반</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="예) LS-6UTPD-3MG RoHS 인증서 주세요"></textarea>
      <button type="button" class="send" id="send">보내기</button>
    </div>
    <div class="hintline" id="hint"></div>
  </footer>
</div>

<script>
(function(){
'use strict';

var API = '';
var state = {
  mode: 'internal',
  session: newSession(),
  busy: false,
  pending: null      // 되묻기 대기: {candidates:[...]}
};

function newSession(){
  return 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}

var $log   = document.getElementById('log');
var $input = document.getElementById('input');
var $send  = document.getElementById('send');
var $hint  = document.getElementById('hint');
var $chips = document.getElementById('chips');
var $modewarn = document.getElementById('modewarn');

/* ------------------------------------------------------------- 유틸 */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function scrollDown(){ $log.scrollTop = $log.scrollHeight; }

/* 3단 폴백.
   1) navigator.clipboard        — 보안 컨텍스트(https/localhost)에서만 존재한다
   2) execCommand('copy')        — 사내망 http://10.x 배포에서 여기까지 온다
   3) 화면에 텍스트를 펼쳐 선택   — 브라우저 정책으로 둘 다 막힌 경우 손으로 ⌘C/Ctrl+C
   담당자가 파일 경로를 못 가져가면 이 화면의 가치가 절반으로 떨어지므로 3)까지 만든다. */
function copyText(txt, btn){
  var done = function(ok){
    if (!ok){ manualCopy(txt, btn); return; }
    if (!btn) return;
    var old = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', old);
    btn.textContent = '복사됨 ✓';
    btn.classList.add('done');
    setTimeout(function(){ btn.textContent = old; btn.classList.remove('done'); }, 1400);
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ done(true); },
                                           function(){ done(execCopy(txt)); });
  } else {
    done(execCopy(txt));
  }
}
function execCopy(txt){
  try{
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}
function manualCopy(txt, btn){
  if (!btn) return;
  var host = btn.parentNode;
  var box = host.querySelector('.manualcopy');
  if (!box){
    box = document.createElement('textarea');
    box.className = 'manualcopy';
    box.readOnly = true;
    host.appendChild(box);
  }
  box.value = txt;
  box.style.display = 'block';
  box.focus(); box.select();
  var old = btn.getAttribute('data-label') || btn.textContent;
  btn.setAttribute('data-label', old);
  btn.textContent = '선택됨 — ⌘C';
  setTimeout(function(){ btn.textContent = old; }, 2500);
}
function copyBtn(label, text, title){
  var b = el('button','copy',label);
  b.type = 'button';
  b.setAttribute('data-label', label);
  if (title) b.title = title;
  b.addEventListener('click', function(){ copyText(text, b); });
  return b;
}

/* ------------------------------------------------------------- 렌더 */
function addUser(text){
  var w = el('div','msg user');
  w.appendChild(el('div','bubble', text));
  $log.appendChild(w); scrollDown();
}
function addSystem(text, isErr){
  var n = el('div','sysline' + (isErr ? ' err' : ''), text);
  $log.appendChild(n); scrollDown();
  return n;
}

function addReply(r){
  var wrap = el('div','msg bot');
  var card = el('div','card');

  /* --- 머리: 라우트 + 근거 배지 --- */
  var head = el('div','card-head');
  var rt = el('span','route-tag', r.route_label || r.route || '응답');
  rt.setAttribute('data-route', r.route || '');
  if (r.route_reason) rt.title = '라우팅 근거: ' + r.route_reason;
  head.appendChild(rt);

  var bg = el('div','badges');
  var list = r.badges && r.badges.length ? r.badges
           : [{key:'rule', label:'규칙기반', hint:'', count:0}];
  list.forEach(function(b){
    var s = el('span','badge');
    s.setAttribute('data-k', b.key || 'other');
    s.textContent = b.label || b.key;
    if (b.count > 1){
      var n = el('span','n','×' + b.count);
      s.appendChild(n);
    }
    var t = b.hint || '';
    if (b.models && b.models.length) t += (t ? ' / ' : '') + '모델: ' + b.models.join(', ');
    if (b.sections && b.sections.length) t += (t ? ' / ' : '') + '섹션 ' + b.sections.join(',');
    if (t) s.title = t;
    bg.appendChild(s);
  });
  head.appendChild(bg);
  if (r.elapsed_ms != null) head.appendChild(el('span','ms', Math.round(r.elapsed_ms) + 'ms'));
  card.appendChild(head);

  /* --- 주의문구 박스 (본문과 별도, 눈에 띄게) --- */
  if (r.notices && r.notices.length){
    var nb = el('div','notices');
    var h = el('h3'); h.textContent = '⚠ 주의문구 ' + r.notices.length + '건 — 고객 회신 전 확인';
    nb.appendChild(h);
    var ul = el('ul');
    r.notices.forEach(function(t){ ul.appendChild(el('li', null, t)); });
    nb.appendChild(ul);
    nb.appendChild(el('p','re','(정책상 아래 본문은 조회 엔진 원문 그대로 출력합니다 — '
      + '같은 문구가 본문 끝에도 남아 있을 수 있습니다.)'));
    card.appendChild(nb);
  }

  /* --- 본문: 서버가 준 문자열 그대로 --- */
  var aiOnly = (r.badges || []).some(function(b){ return b.key === 'spec'; })
            && !(r.badges || []).some(function(b){ return b.key === 'cert'; });
  var body = el('div','body' + (aiOnly ? ' ai-caution' : ''), r.answer || r.text || '');
  card.appendChild(body);

  /* --- 되묻기 후보 버튼 --- */
  if (r.needs_clarification && r.candidates && r.candidates.length){
    var s1 = el('div','sect');
    s1.appendChild(el('h3', null, '어느 쪽인지 선택해 주십시오'));
    var cw = el('div','cands');
    r.candidates.forEach(function(c){
      var b = el('button','cand', c);
      b.type = 'button';
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(cw.querySelectorAll('.cand'), function(x){ x.disabled = true; });
        pickCandidate(c);
      });
      cw.appendChild(b);
    });
    s1.appendChild(cw);
    card.appendChild(s1);
    state.pending = { candidates: r.candidates };
  } else {
    state.pending = null;
  }

  /* --- 파일 위치 / 링크 --- */
  if (r.files && r.files.length){
    var s2 = el('div','sect');
    s2.appendChild(el('h3', null, '파일 ' + r.files.length + '건'));
    r.files.forEach(function(f){
      var row = el('div','file');
      var meta = el('div','fmeta');
      meta.appendChild(el('div','fname', f.filename || f.title_ko || f.doc_id));
      if (f.path) meta.appendChild(el('div','fpath', f.path));
      var tags = [];
      if (f.doc_type) tags.push(f.doc_type);
      if (f.status) tags.push(f.status);
      if (f.note) tags.push(f.note);
      if (tags.length) meta.appendChild(el('div','ftag', tags.join(' · ')));
      var flagbox = el('div','ftag');
      if (f.deliverable === false){
        var w1 = el('span','warnflag','단독 전달 불가');
        flagbox.appendChild(w1); flagbox.appendChild(document.createTextNode(' '));
      }
      if (f.text_extractable === false){
        flagbox.appendChild(el('span','warnflag','스캔 — 원문 인용 불가'));
      }
      if (flagbox.childNodes.length) meta.appendChild(flagbox);
      row.appendChild(meta);

      var acts = el('div','facts');
      if (f.path)       acts.appendChild(copyBtn('경로 복사', f.path, f.path));
      if (f.filename)   acts.appendChild(copyBtn('파일명 복사', f.filename, f.filename));
      if (f.url)        acts.appendChild(linkBtn('파일 열기', f.url));
      if (f.folder_url) acts.appendChild(linkBtn('폴더 열기', f.folder_url));
      if (f.url || f.folder_url) acts.appendChild(copyBtn('링크 복사', f.url || f.folder_url));
      if (f.doc_id)     acts.appendChild(copyBtn('doc_id', f.doc_id, f.doc_id));
      row.appendChild(acts);
      s2.appendChild(row);
    });
    card.appendChild(s2);
  }

  /* --- 응답 전문 복사 + 원본 JSON --- */
  var s3 = el('div','sect');
  var acts2 = el('div','facts');
  acts2.appendChild(copyBtn('응답 전문 복사', r.answer || r.text || ''));
  if (r.models && r.models.length) acts2.appendChild(copyBtn('모델명 복사', r.models.join(', ')));
  s3.appendChild(acts2);
  card.appendChild(s3);

  var det = el('details','raw');
  det.appendChild(el('summary', null, '근거 원본 데이터(JSON) 보기'));
  var pre = el('pre', null, JSON.stringify({
    route: r.route, route_reason: r.route_reason, sources: r.sources,
    models: r.models, model_source: r.model_source, mode: r.mode, data: r.data
  }, null, 1));
  det.appendChild(pre);
  card.appendChild(det);

  wrap.appendChild(card);
  $log.appendChild(wrap);
  scrollDown();
}

function linkBtn(label, href){
  var a = document.createElement('a');
  a.className = 'copy linkbtn';
  a.textContent = label;
  a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.title = href;
  return a;
}

/* ------------------------------------------------------------- 통신 */
function post(path, body){
  return fetch(API + path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  }).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(j){
      return { status: res.status, ok: res.ok, json: j };
    });
  });
}

function describeError(status, j){
  var d = j && j.detail;
  if (typeof d === 'string') return 'HTTP ' + status + ' — ' + d;
  if (d && d.message) return 'HTTP ' + status + ' — ' + d.message;
  if (Array.isArray(d) && d.length && d[0].msg){
    return 'HTTP ' + status + ' — ' + d.map(function(x){
      return (x.loc ? x.loc.join('.') + ': ' : '') + x.msg; }).join(' / ');
  }
  return 'HTTP ' + status + ' — 요청을 처리하지 못했습니다.';
}

function setBusy(b){
  state.busy = b;
  $send.disabled = b;
  $send.textContent = b ? '조회 중…' : '보내기';
}

function send(text){
  if (state.busy) return;
  text = (text || '').trim();
  if (!text) return;
  addUser(text);
  $input.value = ''; autoGrow();
  setBusy(true);
  var wait = addSystem('조회 중…');
  post('/chat', { message: text, session_id: state.session, mode: state.mode })
    .then(function(r){
      wait.remove();
      if (!r.ok){ addSystem(describeError(r.status, r.json), true); return; }
      addReply(r.json);
    })
    .catch(function(e){ wait.remove(); addSystem('네트워크 오류: ' + e, true); })
    .then(function(){ setBusy(false); $input.focus(); });
}

function pickCandidate(choice){
  if (state.busy) return;
  addUser(choice);
  setBusy(true);
  var wait = addSystem('선택 반영 중…');
  post('/clarify', { session_id: state.session, choice: choice, mode: state.mode })
    .then(function(r){
      wait.remove();
      if (r.status === 409){                    // 대기 상태가 없다 → 일반 문의로 재전송
        return post('/chat', { message: choice, session_id: state.session, mode: state.mode })
          .then(function(r2){
            if (!r2.ok){ addSystem(describeError(r2.status, r2.json), true); return; }
            addReply(r2.json);
          });
      }
      if (!r.ok){ addSystem(describeError(r.status, r.json), true); return; }
      if (r.json && r.json.ok === false){
        addSystem(r.json.answer || '후보를 특정하지 못했습니다.', true); return;
      }
      addReply(r.json);
    })
    .catch(function(e){ wait.remove(); addSystem('네트워크 오류: ' + e, true); })
    .then(function(){ setBusy(false); $input.focus(); });
}

/* ------------------------------------------------------------- 모드 / 헬스 */
var $mi = document.getElementById('m-internal');
var $mc = document.getElementById('m-customer');

function setMode(m){
  state.mode = m;
  $mi.setAttribute('aria-pressed', String(m === 'internal'));
  $mc.setAttribute('aria-pressed', String(m === 'customer'));
  if (m === 'customer'){
    $modewarn.hidden = false;
    $modewarn.textContent = '고객(customer) 모드: 파일 경로와 O* 추론매핑이 숨겨집니다. '
      + '사내 확인용으로는 사내(internal) 모드를 쓰십시오.';
  } else {
    $modewarn.hidden = false;
    $modewarn.textContent = '사내(internal) 모드: 파일 경로·O* 추론매핑이 그대로 표시됩니다. '
      + '이 화면 내용을 고객에게 그대로 전달하지 마십시오.';
  }
}
$mi.addEventListener('click', function(){ setMode('internal'); });
$mc.addEventListener('click', function(){ setMode('customer'); });

document.getElementById('btn-reset').addEventListener('click', function(){
  state.session = newSession();
  state.pending = null;
  $log.innerHTML = '';
  greet();
  $input.focus();
});

function loadHealth(){
  var $d = document.getElementById('hdot');
  var $t = document.getElementById('htext');
  fetch(API + '/health').then(function(r){ return r.json(); }).then(function(h){
    var bits = [];
    bits.push('인증KB ' + ((h.cert_kb && h.cert_kb.documents) || 0) + '건');
    bits.push('상담 ' + ((h.master && h.master.qa_rows) || 0) + '건');
    bits.push('LLM ' + (h.llm && h.llm.available ? 'ON' : 'OFF(규칙기반)'));
    $t.textContent = bits.join(' · ');
    $d.className = 'dot ' + (h.ok ? 'ok' : 'bad');
    var tip = bits.join('\n');
    if (h.problems && h.problems.length) tip += '\n\n문제:\n- ' + h.problems.join('\n- ');
    document.getElementById('health').title = tip;
    if (h.problems && h.problems.length){
      addSystem('서버 경고: ' + h.problems.join(' / '), true);
    }
  }).catch(function(){
    $d.className = 'dot bad'; $t.textContent = '서버 응답 없음';
  });
}

/* ------------------------------------------------------------- 입력 */
function autoGrow(){
  /* 값이 비어 있으면 CSS min-height 로 되돌린다. placeholder 기준으로 재면 첫 레이아웃
     (폰트 로드 전, 폭 미확정)에서 줄바꿈이 과도하게 잡혀 입력창이 통째로 늘어난다. */
  if (!$input.value){ $input.style.height = ''; return; }
  $input.style.height = 'auto';
  $input.style.height = Math.min(160, $input.scrollHeight) + 'px';
}
$input.addEventListener('input', autoGrow);
$input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    send($input.value);
  }
});
$send.addEventListener('click', function(){ send($input.value); });

$hint.textContent = 'Enter 전송 · Shift+Enter 줄바꿈 — 인증·자료 문의는 인증KB 만을 근거로 답합니다. '
  + '제품분석 배지가 붙은 내용은 제품 이미지 기반 AI 추정이라 확정 사양이 아닙니다.';

setMode('internal');
greet();
