<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/b2b/manifest.json">
  <link rel="apple-touch-icon" href="/b2b/icon.svg">
  <link rel="stylesheet" href="/b2b/style.css?v=1">
  <title>랜스타 간편발주</title>
</head>
<body>

  <!-- 로그인 -->
  <section id="login">
    <div class="brand">
      <img src="/b2b/icon.svg" alt="">
      <h1>랜스타 간편발주</h1>
      <p>거래처 전용 · 원터치 발주</p>
    </div>
    <div class="field">
      <label>거래처코드</label>
      <input id="in-cust" inputmode="text" autocomplete="username" placeholder="예: 00123">
    </div>
    <div class="field">
      <label>PIN</label>
      <input id="in-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN 번호">
    </div>
    <button class="btn" id="btn-login">로그인</button>
  </section>

  <!-- 앱 -->
  <section id="app" class="hidden">
    <header>
      <div class="who">
        <b id="who-name">-</b>
        <small id="who-tier">-</small>
      </div>
      <button class="logout" id="btn-logout">로그아웃</button>
    </header>
    <div class="tabbar">
      <button data-tab="order" class="active">발주하기</button>
      <button data-tab="history">발주내역</button>
    </div>

    <main id="tab-order">
      <div id="catalog"><div class="empty">불러오는 중…</div></div>
    </main>

    <main id="tab-history" class="hidden">
      <div id="history"><div class="empty">불러오는 중…</div></div>
    </main>

    <div class="orderbar" id="orderbar">
      <div class="total">
        <small id="order-count">0개 품목</small>
        <b id="order-total">₩0</b>
      </div>
      <button class="btn" id="btn-submit" disabled>발주하기</button>
    </div>
  </section>

  <div id="toast"></div>
  <script src="/b2b/app.js?v=1"></script>
</body>
</html>
